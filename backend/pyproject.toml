[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmag"
version = "1.0.0"
description = "Deal Memo Auto Generator — grounded PE memo pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pdfplumber>=0.10",
  "python-docx>=1.0",
  "docxtpl>=0.16",
  "python-dotenv>=1.0",
  "google-genai>=1.0",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "requests>=2.28",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sse-starlette>=2.0",
  "python-multipart>=0.0.9",
  "rank_bm25>=0.2.2",
  "chromadb>=0.5.0",
  "redis>=5.0",
  "rq>=1.16",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
dmag = "dmag.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmag*", "api*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
